name = "inquisitor"
version = "0.1.0"
description = "Supply-chain gate for agent skills: inspect before the agent reads."
author = "Techkeyy"
wasm_path = "inquisitor.wasm"

capabilities = ["tool"]

# Only what the code reaches. `config_read` carries the RPC endpoint and issuer
# for the attestation path; nothing here needs the filesystem, and an
# undeclared permission is a host surface the component cannot touch.
#
# `http_client` is added at the SAS step, not before — it is all-or-nothing and
# the sandbox does not bound where a granted plugin sends data.
permissions = ["config_read"]
