[package]
name = "inquisitor-publish"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Operator-side CLI that publishes Inquisitor verdicts as Solana attestations."

# Deliberately a separate crate, not an example of the plugin.
#
# The agent never signs. Keeping the signing path in its own binary makes that a
# structural fact rather than a promise: these dependencies cannot end up in the
# component even by accident, and the plugin's manifest stays at
# config_read + http_client.
#
# Two dependencies are avoided on purpose, both for the same reason — they pull
# `openssl-sys`, which needs a native OpenSSL toolchain Windows lacks:
#
#   solana-client  — only three RPC methods are needed; plain JSON-RPC over
#                    rustls does the job (see src/rpc.rs).
#   solana-sdk     — reaches openssl via solana-precompiles → secp256r1. The
#                    modular crates below expose the same API surface, and
#                    `precompiles` is an optional feature we simply do not enable.

[dependencies]
inquisitor = { path = ".." }
solana-attestation-service-client = "1.0.9"
solana-program = "2"
solana-keypair = "2"
solana-signer = "2"
solana-transaction = { version = "2", features = ["bincode"] }
solana-message = "2"
solana-pubkey = { version = "2", features = ["curve25519"] }
solana-hash = "2"
solana-system-interface = "1"
anyhow = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde_json = "1"
bincode = "1"
base64 = "0.22"

[workspace]
