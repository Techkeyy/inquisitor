[package]
name = "inquisitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Supply-chain gate for ZeroClaw agent skills, with verdicts published to Solana."
repository = "https://github.com/Techkeyy/inquisitor"

[lib]
# cdylib for the component build; rlib so the pure-logic modules unit-test natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# curve25519 is required for find_program_address; without it the crate builds
# but PDA derivation is absent. See README, "On the Solana crates in a component".
solana-pubkey = { version = "2", features = ["curve25519"] }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"
# Blocking wasi:http client. reqwest cannot work here — a component has no
# socket surface, only wasi:http.
waki = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
