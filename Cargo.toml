[package]
name = "inquisitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Supply-chain gate for ZeroClaw agent skills, with verdicts published to Solana."
repository = "https://github.com/Techkeyy/inquisitor"

[lib]
# cdylib for the component build; rlib so the pure-logic modules unit-test natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
